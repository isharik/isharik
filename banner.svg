<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Echo — Full Stack Developer</title>
  <desc id="desc">A restrained dark terminal-inspired profile banner with an abstract diagonal stream of cyan, violet, and red ASCII glyphs.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset=".58" stop-color="#0a0d15"/>
      <stop offset="1" stop-color="#10101a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4e77" stop-opacity="0"/>
      <stop offset=".28" stop-color="#ff4e77" stop-opacity=".72"/>
      <stop offset=".54" stop-color="#df83ff" stop-opacity=".84"/>
      <stop offset=".74" stop-color="#55d8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#55d8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a7c" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#d99bff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#69e1ff" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9daac1" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="right">
      <path d="M610 480 1070 0h530v480z"/>
    </clipPath>
  </defs>
  <rect width="1600" height="480" rx="4" fill="url(#base)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <g clip-path="url(#right)">
    <path d="M600 520 1090 -20" stroke="url(#beam)" stroke-width="122" opacity=".12" filter="url(#soft)"/>
    <path d="M690 520 1180 -20" stroke="url(#beam)" stroke-width="2" opacity=".8"/>
    <path d="M760 520 1250 -20" stroke="url(#beam)" stroke-width="1" opacity=".45"/>
    <path d="M560 520 1050 -20" stroke="url(#beam)" stroke-width="1" opacity=".3"/>
    <g fill="url(#glyph)" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="7" opacity=".78">
      <text transform="rotate(-46 1040 240)" x="790" y="115"># + * 0 1 / : ; { } &lt; &gt; % + * 0 1</text>
      <text transform="rotate(-46 1040 240)" x="770" y="145">. : # + * 0 1 / : ; { } &lt; &gt; % + * 0</text>
      <text transform="rotate(-46 1040 240)" x="750" y="175">+ * . 0 1 # / : ; &lt; &gt; { } + * . 0 1 #</text>
      <text transform="rotate(-46 1040 240)" x="730" y="205">1 0 + # / : ; { } &lt; &gt; % * . + # 1 0</text>
      <text transform="rotate(-46 1040 240)" x="710" y="235">; : . + * # 0 1 / { } &lt; &gt; % + * # 0</text>
      <text transform="rotate(-46 1040 240)" x="690" y="265">% &gt; &lt; { } / # + * . : ; 1 0 # + * . :</text>
      <text transform="rotate(-46 1040 240)" x="670" y="295">+ # 1 0 ; : . * + / { } &lt; &gt; % 1 0 # +</text>
      <text transform="rotate(-46 1040 240)" x="650" y="325">. * + / : ; # 0 1 % &lt; &gt; { } + * # 0 1</text>
      <text transform="rotate(-46 1040 240)" x="630" y="355">0 1 # + * . : ; / &lt; &gt; { } % + 1 0 # *</text>
      <text transform="rotate(-46 1040 240)" x="610" y="385">: ; / + # * . 1 0 { } &lt; &gt; % # + * . 0</text>
    </g>
    <g stroke="url(#beam)" stroke-width="1" opacity=".55">
      <path d="M640 470 1090 0"/><path d="M680 480 1150 0"/><path d="M720 480 1210 0"/>
      <path d="M840 480 1320 0"/><path d="M920 480 1400 0"/><path d="M1000 480 1480 0"/>
    </g>
  </g>
  <path d="M80 112h46" stroke="#67dfff" stroke-width="2"/>
  <text x="80" y="158" fill="#67dfff" font-family="Consolas,Menlo,monospace" font-size="15" letter-spacing="4">ISHARIK / 01</text>
  <text x="76" y="265" fill="#f0f3f7" font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="700" letter-spacing="-4">ECHO</text>
  <text x="82" y="307" fill="#a8b0bd" font-family="Consolas,Menlo,monospace" font-size="16" letter-spacing="2">FULL STACK  ·  WEB3</text>
  <path d="M82 350h230" stroke="#414857" stroke-width="1"/>
  <text x="82" y="383" fill="#788394" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="1">COMPUTER SCIENCE ENGINEERING</text>
  <rect x="1" y="1" width="1598" height="478" fill="none" stroke="#353b48" stroke-opacity=".65"/>
</svg>
